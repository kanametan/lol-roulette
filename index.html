<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101a2b">
<meta property="og:title" content="LoL ランダムルーレット">
<meta property="og:description" content="レーンとチャンピオンをランダムに決めよう！">
<title>LoL ランダムルーレット</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#121f33;--panel2:#1a2b43;--gold:#c8aa6e;--blue:#0ac8b9;--muted:#9aabc2}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#1b3550 0,#0b1220 58%);color:#f2f5f9;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;min-height:100vh}
main{max-width:850px;margin:auto;padding:28px 16px 56px}.hero{text-align:center;margin:10px 0 24px}.eyebrow{color:var(--gold);letter-spacing:.18em;font-size:12px;font-weight:800}.hero h1{font-size:clamp(28px,6vw,46px);margin:8px 0}.hero p{color:var(--muted);margin:0}
.panel{background:linear-gradient(145deg,rgba(26,43,67,.96),rgba(15,27,44,.96));border:1px solid #31445d;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 12px 35px #0004}
h2{font-size:17px;margin:0 0 14px}.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.lane{background:#0e1a2b;color:#e8eef7;border:1px solid #34475f;border-radius:13px;padding:13px 6px;font-size:14px;font-weight:700;cursor:pointer}.lane span{display:block;font-size:23px;margin-bottom:4px}.lane.active{border-color:var(--gold);background:#3a3428;box-shadow:inset 0 0 0 1px var(--gold)}
.result{min-height:180px;border:1px solid #4a5a6e;border-radius:16px;background:linear-gradient(130deg,#0b1729,#1b3047);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}.result .small{color:var(--muted);font-size:13px}.result .laneout{font-size:24px;font-weight:800;margin:5px}.result .champ{font-size:clamp(27px,6vw,42px);font-weight:900;color:var(--gold);margin:8px 0;overflow-wrap:anywhere}.result .placeholder{font-size:36px}
button{font:inherit}.spin{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:linear-gradient(90deg,#b99755,#e0c78f);color:#152033;font-weight:900;font-size:18px;cursor:pointer}.spin:hover{filter:brightness(1.08)}.spin:active{transform:scale(.99)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.secondary{background:#0d1929;border:1px solid #40536b;color:#dce5ef;border-radius:10px;padding:9px 13px;cursor:pointer}
.search{width:100%;padding:12px;border-radius:10px;border:1px solid #40536b;background:#0c1828;color:white;font:inherit;margin:8px 0 12px}
.champions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:250px;overflow:auto;padding-right:4px}.champ{font-size:13px}.champ label{display:flex;gap:7px;align-items:center;background:#0c1828;padding:8px;border-radius:8px;color:#dce5ef}.champ input{accent-color:var(--gold)}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:13px}.history{display:grid;gap:7px}.historyrow{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;background:#0c1828;border-radius:9px}.historyrow span:last-child{color:var(--gold);font-weight:700;text-align:right}
footer{text-align:center;color:#71839a;font-size:12px;margin-top:24px}
@media(max-width:520px){main{padding:18px 12px 40px}.panel{padding:15px}.champions{grid-template-columns:repeat(2,1fr)}.lanes{gap:7px}.lane{padding:10px 3px;font-size:13px}}
</style>
</head>
<body><main>
<header class="hero"><div class="eyebrow">SUMMONER'S RIFT • RANDOM PICK</div><h1>🎲 LoL ルーレット</h1><p>今日のレーンとチャンピオンは運命におまかせ！</p></header>
<section class="panel"><h2>① レーンを選択</h2><div class="lanes" id="lanes"></div></section>
<section class="panel"><h2>② 運命のピック</h2><div class="result" aria-live="polite"><div class="small" id="resultLabel">まだ運命は決まっていない…</div><div class="laneout" id="laneResult">🎲 おまかせ</div><div class="champ" id="champResult">？？？</div><div class="small" id="remaining"></div></div><button class="spin" id="spin">🎰 ルーレットを回す！</button><div class="tools"><button class="secondary" id="again">もう一回！</button><button class="secondary" id="reset">リセット</button></div></section>
<section class="panel"><h2>③ 抽選対象をカスタマイズ</h2><div class="meta"><span>チェックしたチャンピオンは抽選から除外</span><strong id="count"></strong></div><input class="search" id="search" placeholder="チャンピオン名で検索…"><div class="tools" style="margin:0 0 12px"><button class="secondary" id="all">全員を抽選対象に戻す</button><button class="secondary" id="none">全員を除外</button></div><div class="champions" id="champions"></div></section>
<section class="panel"><h2>④ 抽選履歴</h2><div class="history" id="history"><div class="small">まだ抽選されていません。</div></div></section>
<footer>Unofficial fan-made tool • League of Legends is a trademark of Riot Games.</footer>
</main>
<script>
const CHAMPS = ["Aatrox", "Ahri", "Akali", "Akshan", "Alistar", "Ambessa", "Amumu", "Anivia", "Annie", "Aphelios", "Ashe", "Aurelion Sol", "Aurora", "Azir", "Bard", "Bel'Veth", "Blitzcrank", "Brand", "Braum", "Briar", "Caitlyn", "Camille", "Cassiopeia", "Cho'Gath", "Corki", "Darius", "Diana", "Dr. Mundo", "Draven", "Ekko", "Elise", "Evelynn", "Ezreal", "Fiddlesticks", "Fiora", "Fizz", "Galio", "Gangplank", "Garen", "Gnar", "Gragas", "Graves", "Gwen", "Hecarim", "Heimerdinger", "Hwei", "Illaoi", "Irelia", "Ivern", "Janna", "Jarvan IV", "Jax", "Jayce", "Jhin", "Jinx", "K'Sante", "Kai'Sa", "Kalista", "Karma", "Karthus", "Kassadin", "Katarina", "Kayle", "Kayn", "Kennen", "Kha'Zix", "Kindred", "Kled", "Kog'Maw", "LeBlanc", "Lee Sin", "Leona", "Lillia", "Lissandra", "Lucian", "Lulu", "Lux", "Malphite", "Malzahar", "Maokai", "Master Yi", "Mel", "Milio", "Miss Fortune", "Mordekaiser", "Morgana", "Naafiri", "Nami", "Nasus", "Nautilus", "Neeko", "Nidalee", "Nilah", "Nocturne", "Nunu & Willump", "Olaf", "Orianna", "Ornn", "Pantheon", "Poppy", "Pyke", "Qiyana", "Quinn", "Rakan", "Rammus", "Rek'Sai", "Rell", "Renata Glasc", "Renekton", "Rengar", "Riven", "Rumble", "Ryze", "Samira", "Sejuani", "Senna", "Seraphine", "Sett", "Shaco", "Shen", "Shyvana", "Singed", "Sion", "Sivir", "Skarner", "Smolder", "Sona", "Soraka", "Swain", "Sylas", "Syndra", "Tahm Kench", "Taliyah", "Talon", "Taric", "Teemo", "Thresh", "Tristana", "Trundle", "Tryndamere", "Twisted Fate", "Twitch", "Udyr", "Urgot", "Varus", "Vayne", "Veigar", "Vel'Koz", "Vex", "Vi", "Viego", "Viktor", "Vladimir", "Volibear", "Warwick", "Wukong", "Xayah", "Xerath", "Xin Zhao", "Yasuo", "Yone", "Yorick", "Yunara", "Yuumi", "Zaahen", "Zac", "Zed", "Zeri", "Ziggs", "Zilean", "Zoe", "Zyra"];
const LANES=[["おまかせ","🎲"],["トップ","🛡️"],["ジャングル","🌲"],["ミッド","✨"],["ADC","🏹"],["サポート","💚"]];
let lane="おまかせ", excluded=new Set(), history=[];
const $=id=>document.getElementById(id);
function renderLanes(){$("lanes").innerHTML=LANES.map(([n,e])=>`<button class="lane ${lane===n?"active":""}" data-lane="${n}"><span>${e}</span>${n}</button>`).join("");document.querySelectorAll("[data-lane]").forEach(b=>b.onclick=()=>{lane=b.dataset.lane;renderLanes()})}
function renderChampions(){const q=$("search").value.toLowerCase();$("champions").innerHTML=CHAMPS.filter(c=>c.toLowerCase().includes(q)).map(c=>`<div class="champ"><label><input type="checkbox" data-champ="${encodeURIComponent(c)}" ${excluded.has(c)?"checked":""}>${c}</label></div>`).join("");document.querySelectorAll("[data-champ]").forEach(el=>el.onchange=()=>{const c=decodeURIComponent(el.dataset.champ);el.checked?excluded.add(c):excluded.delete(c);updateCount()});updateCount()}
function updateCount(){$("count").textContent=`対象 ${CHAMPS.length-excluded.size} / ${CHAMPS.length}体`}
function spin(){const pool=CHAMPS.filter(c=>!excluded.has(c));if(!pool.length){alert("抽選対象がいません。除外設定を見直してね！");return}const c=pool[Math.floor(Math.random()*pool.length)];const chosen=lane==="おまかせ"?LANES[1+Math.floor(Math.random()*5)][0]:lane;const icon=LANES.find(x=>x[0]===chosen)[1];$("resultLabel").textContent="今回の運命のチャンピオンは…";$("laneResult").textContent=`${icon} ${chosen}`;$("champResult").textContent=c;$("remaining").textContent=`抽選対象 ${pool.length}体`;history.unshift({lane:chosen,champ:c});history=history.slice(0,10);renderHistory()}
function renderHistory(){$("history").innerHTML=history.length?history.map((h,i)=>`<div class="historyrow"><span>#${i+1}　${h.lane}</span><span>${h.champ}</span></div>`).join(""):'<div class="small">まだ抽選されていません。</div>'}
function reset(){$("resultLabel").textContent="まだ運命は決まっていない…";$("laneResult").textContent="🎲 おまかせ";$("champResult").textContent="？？？";$("remaining").textContent="";history=[];renderHistory()}
$("spin").onclick=spin;$("again").onclick=spin;$("reset").onclick=reset;$("search").oninput=renderChampions;$("all").onclick=()=>{excluded.clear();renderChampions()};$("none").onclick=()=>{excluded=new Set(CHAMPS);renderChampions()};
renderLanes();renderChampions();renderHistory();
</script></body></html>
